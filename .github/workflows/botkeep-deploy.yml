name: Deploy to BOTKEEP.CLOUD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-botkeep:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Telegram Webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$APP_URL" ]; then echo "Telegram webhook secrets not set, skipping"; exit 0; fi
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"${APP_URL}/webhook/telegram\"}"

      - name: Health Check
        env:
          BOTKEEP_URL: ${{ vars.BOTKEEP_URL }}
          D1_API_URL: https://quantum-bot-d1.foolahmad556.workers.dev
        run: |
          if [ -z "$BOTKEEP_URL" ]; then echo "BOTKEEP_URL var not set, skipping"; else curl --retry 5 --retry-delay 3 -f "${BOTKEEP_URL}/api/health" || exit 1; fi
          curl --retry 5 --retry-delay 3 -f "$D1_API_URL/health" || exit 1

      - name: Verify D1 auth boundary
        env:
          D1_API_URL: https://quantum-bot-d1.foolahmad556.workers.dev
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$D1_API_URL/d1/council/shadow?limit=1")" = "401" || exit 1
          echo "D1 shadow endpoint protected" 

      - name: Verify runtime D1 configuration
        env:
          D1_API_URL: ${{ vars.D1_API_URL }}
        run: |
          if [ -n "$D1_API_URL" ]; then echo "D1_API_URL configured"; else echo "D1_API_URL repository variable not set; runtime storage must be configured in Botkeep"; fi
          grep -q 'EXPOSE 3000' Dockerfile || exit 1
          echo "Docker port contract verified"