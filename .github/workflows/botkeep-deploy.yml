name: Build and release Botkeep image
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: botkeep-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Release instructions
        run: |
          echo 'Image built and pushed. Botkeep must be configured to deploy this immutable tag.' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.image.outputs.name }}:${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not claim that the Botkeep runtime has deployed or passed readiness.' >> "$GITHUB_STEP_SUMMARY"
