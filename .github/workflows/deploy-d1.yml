name: Deploy Cloudflare D1 Worker

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler.toml
      - name: Set D1 API secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_API_SECRET: ${{ secrets.D1_API_SECRET }}
        run: |
          if [ -n "$D1_API_SECRET" ]; then
            printf '%s' "$D1_API_SECRET" | npx wrangler@4 secret put D1_API_SECRET --config wrangler.toml
          else
            echo "D1_API_SECRET not configured; deploy continues without API secret"
          fi
