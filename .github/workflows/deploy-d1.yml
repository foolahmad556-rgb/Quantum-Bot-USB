name: Deploy Cloudflare D1 Worker
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
concurrency:
  group: d1-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_API_SECRET: ${{ secrets.D1_API_SECRET }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate explicit environment configuration
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          BOTKEEP_URL: ${{ vars.BOTKEEP_URL }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ vars.TELEGRAM_ALLOWED_USER_IDS }}
        run: |
          test -n "$D1_API_SECRET"
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const required = key => { const value=process.env[key]; if(!value) throw Error(key+' required'); return value; };
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify({
            name: required('WORKER_NAME'), main: 'd1-worker.js', compatibility_date: '2024-01-01',
            d1_databases: [{binding:'DB', database_name:required('D1_DATABASE_NAME'), database_id:required('D1_DATABASE_ID'), migrations_dir:'migrations'}],
            vars: {BOTKEEP_URL:required('BOTKEEP_URL'), TELEGRAM_ALLOWED_CHAT_IDS:required('TELEGRAM_ALLOWED_CHAT_IDS'), TELEGRAM_ALLOWED_USER_IDS:required('TELEGRAM_ALLOWED_USER_IDS')}
          }));
          JS
      - name: Apply additive migrations and deploy
        run: |
          npx wrangler@4 d1 migrations apply DB --remote --config wrangler.deploy.json
          npx wrangler@4 deploy --config wrangler.deploy.json
          printf '%s' "$D1_API_SECRET" | npx wrangler@4 secret put D1_API_SECRET --config wrangler.deploy.json
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler@4 secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.deploy.json
      - name: Verify authenticated database readiness
        env:
          D1_API_URL: ${{ vars.D1_API_URL }}
        run: |
          node --input-type=module <<'JS'
          const base = new URL(process.env.D1_API_URL); if(base.protocol!=='https:') throw Error('HTTPS D1_API_URL required');
          const response = await fetch(new URL('/d1/health',base), {headers:{Authorization:`Bearer ${process.env.D1_API_SECRET}`},signal:AbortSignal.timeout(10000)});
          if(!response.ok || !(await response.json()).ok) throw Error('D1 readiness failed');
          const denied = await fetch(new URL('/d1/health',base)); if(denied.status!==401) throw Error('D1 auth boundary failed');
          JS
