name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
  deployments: write
concurrency:
  group: pages-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build UI for the selected backend
        env:
          VITE_API_URL: ${{ vars.BOTKEEP_URL }}
        run: |
          node -e 'const u=new URL(process.env.VITE_API_URL); if(u.protocol!=="https:") throw Error("HTTPS BOTKEEP_URL required")'
          npm run build
      - name: Deploy static assets only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ inputs.environment }}
