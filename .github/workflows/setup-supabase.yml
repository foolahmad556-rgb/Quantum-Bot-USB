name: Setup Supabase Tables

on:
  workflow_dispatch:  # يمكن تشغيله يدوياً
  repository_dispatch:
    types: [setup-supabase]

jobs:
  setup-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Supabase CLI
        run: |
          curl -L https://github.com/supabase/cli/releases/download/v2.0.0/supabase_cli_linux_x86_64.tar.gz | tar xz -C /usr/local/bin

      - name: Setup Supabase Tables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # تعيين المتغيّرات
          export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          export SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          # SQL لإنشاء الجداول
          cat > schema.sql << 'EOF'
          CREATE TABLE IF NOT EXISTS trading_signals (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            signal_type TEXT NOT NULL,
            symbol TEXT NOT NULL,
            action TEXT NOT NULL,
            price NUMERIC NOT NULL,
            quantity NUMERIC NOT NULL,
            timestamp TIMESTAMPTZ DEFAULT NOW(),
            status TEXT DEFAULT 'pending',
            strategy TEXT,
            confidence NUMERIC,
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS execution_logs (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            signal_id BIGINT REFERENCES trading_signals(id),
            message TEXT,
            level TEXT DEFAULT 'info',
            api_response JSONB,
            error_details JSONB,
            created_at TIMESTAMPTZ DEFAULT NOW()
          );

          CREATE TABLE IF NOT EXISTS positions (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            symbol TEXT NOT NULL,
            position_size NUMERIC NOT NULL,
            entry_price NUMERIC,
            current_price NUMERIC,
            pnl NUMERIC,
            status TEXT DEFAULT 'open',
            opened_at TIMESTAMPTZ DEFAULT NOW(),
            closed_at TIMESTAMPTZ,
            strategy TEXT
          );

          CREATE TABLE IF NOT EXISTS orders (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            signal_id BIGINT REFERENCES trading_signals(id),
            order_type TEXT NOT NULL,
            side TEXT NOT NULL,
            symbol TEXT NOT NULL,
            qty NUMERIC NOT NULL,
            price NUMERIC,
            status TEXT DEFAULT 'pending',
            order_id TEXT,
            client_order_id TEXT,
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW()
          );
          EOF

          echo "Supabase schema prepared successfully"
          echo "Run this SQL in Supabase Dashboard: SQL Editor"

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Supabase Setup Complete - Tables Ready in ${{ secrets.SUPABASE_URL }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}