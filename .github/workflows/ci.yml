name: Basel Quantum CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXECUTION_MODE: PAPER
      AUTO_START_TRADING: 'false'
      AUTOSTART_TRADING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:parity
      - run: npm run build:full
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Ensure frontend bundle contains no backend or database
        run: |
          test ! -e dist/server.cjs
          test ! -e dist/users.db
          test -e build/server.cjs
      - name: Strategy/council diagnostic evaluation
        run: npm run evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: data/evaluation/latest.json
          retention-days: 14
